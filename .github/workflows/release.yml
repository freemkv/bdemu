name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VER="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          if [ "$CARGO_VER" != "${{ github.ref_name }}" ]; then
            echo "::error::Cargo.toml says $CARGO_VER but tag is ${{ github.ref_name }}"
            exit 1
          fi
          echo "Version match: $CARGO_VER"

      # bdemu git-tag-pins libfreemkv via a committed [patch.crates-io] (so the
      # build starts the instant the libfreemkv tag exists, not after its
      # crates.io publish). This check asserts the Cargo.lock libfreemkv comes
      # from THIS release's git tag — not a crates.io registry source or a local
      # path — and that the direct + transitive (unlock-ld) refs unified to one.
      - name: Verify Cargo.lock libfreemkv is from the expected git tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          python3 - "$TAG" <<'PY'
          import sys, re
          tag = sys.argv[1]
          try:
              with open("Cargo.lock") as f:
                  text = f.read()
          except FileNotFoundError:
              print("::error::Cargo.lock not found")
              sys.exit(1)
          if not text.strip():
              print("::error::Cargo.lock is empty or truncated")
              sys.exit(1)
          blocks = re.split(r'(?m)^\[\[package\]\]\s*$', text)
          matches = []
          for b in blocks:
              if not re.search(r'(?m)^name\s*=\s*"libfreemkv"\s*$', b):
                  continue
              ver_m = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', b)
              src_m = re.search(r'(?m)^source\s*=\s*"([^"]+)"\s*$', b)
              matches.append((ver_m.group(1) if ver_m else None,
                              src_m.group(1) if src_m else None))
          if not matches:
              print("::error::Cargo.lock has no libfreemkv entry")
              sys.exit(1)
          if len(matches) > 1:
              print(f"::error::Cargo.lock has {len(matches)} libfreemkv entries "
                    f"(direct + transitive not unified by the [patch.crates-io] git redirect): {matches}")
              sys.exit(1)
          lock_ver, lock_src = matches[0]
          expected = f"?tag={tag}"
          if not lock_src or "git+https://github.com/freemkv/libfreemkv" not in lock_src:
              print(f"::error::Cargo.lock libfreemkv must come from the libfreemkv git repo, "
                    f"not crates.io or a local path. (saw source={lock_src!r})")
              sys.exit(1)
          if expected not in lock_src:
              print(f"::error::Cargo.lock libfreemkv git source is {lock_src!r} but this "
                    f"release tag is {tag}; expected it to pin {expected}.")
              sys.exit(1)
          print(f"Cargo.lock libfreemkv = {lock_ver} from {lock_src} (OK)")
          PY

  # Tests run as a PARALLEL TRIPWIRE: they fail the run if they fail, but the
  # build job does NOT `needs:` this job. The tag decision was already gated by
  # the local precommit (same Rust 1.86, same commit).
  test:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  build:
    # NOTE: deliberately does NOT `needs: test` — see the test job above.
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release

      - name: Package
        run: |
          DIR="bdemu-${{ github.ref_name }}"
          mkdir -p "$DIR/profiles"
          cp target/release/bdemu "$DIR/"
          cp target/release/libbdemu.so "$DIR/" 2>/dev/null || true
          cp -r profiles/* "$DIR/profiles/" 2>/dev/null || true
          # Versioned archive
          tar czf "${DIR}-x86_64-linux.tar.gz" "$DIR"
          # Stable-name archive (for /latest/ URLs)
          tar czf "bdemu-x86_64-linux.tar.gz" "$DIR"

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tar.gz'

  update-readme:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Update version in README
        run: |
          VERSION="${{ github.ref_name }}"
          DATE="$(date -u '+%Y-%m-%d')"
          sed -i "s|^\*\*Latest: v[0-9]*\.[0-9]*\.[0-9]*.*(.*)\*\*|**Latest: ${VERSION} (${DATE})**|" README.md
          sed -i "s|^\*\*Latest: v[0-9]*\.[0-9]*\.[0-9]*\*\*|**Latest: ${VERSION} (${DATE})**|" README.md
          sed -i "s|bdemu-v[0-9]*\.[0-9]*\.[0-9]*|bdemu-${VERSION}|g" README.md
          sed -i "s|/download/v[0-9]*\.[0-9]*\.[0-9]*/|/download/${VERSION}/|g" README.md
          sed -i "s|bdemu [0-9]*\.[0-9]*\.[0-9]*|bdemu ${VERSION#v}|g" README.md
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update to bdemu ${{ github.ref_name }}"
          git push

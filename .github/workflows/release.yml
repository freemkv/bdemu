name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VER="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          if [ "$CARGO_VER" != "${{ github.ref_name }}" ]; then
            echo "::error::Cargo.toml says $CARGO_VER but tag is ${{ github.ref_name }}"
            exit 1
          fi
          echo "Version match: $CARGO_VER"

      - name: Verify Cargo.lock libfreemkv matches tag and is from crates.io
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          python3 - "$TAG_VER" <<'PY'
          import sys, re
          tag = sys.argv[1]
          try:
              with open("Cargo.lock") as f:
                  text = f.read()
          except FileNotFoundError:
              print("::error::Cargo.lock not found")
              sys.exit(1)
          if not text.strip():
              print("::error::Cargo.lock is empty or truncated")
              sys.exit(1)
          # Split into [[package]] blocks; defend against multiple libfreemkv entries.
          blocks = re.split(r'(?m)^\[\[package\]\]\s*$', text)
          matches = []
          for b in blocks:
              name_m = re.search(r'(?m)^name\s*=\s*"libfreemkv"\s*$', b)
              if not name_m:
                  continue
              ver_m = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', b)
              src_m = re.search(r'(?m)^source\s*=\s*"([^"]+)"\s*$', b)
              matches.append((ver_m.group(1) if ver_m else None,
                              src_m.group(1) if src_m else None))
          if not matches:
              print("::error::Cargo.lock has no libfreemkv entry")
              sys.exit(1)
          if len(matches) > 1:
              print(f"::error::Cargo.lock has {len(matches)} libfreemkv entries: {matches}")
              sys.exit(1)
          lock_ver, lock_src = matches[0]
          if lock_ver != tag:
              print(f"::error::Cargo.lock libfreemkv = {lock_ver} but tag is {tag}. "
                    f"Cause: cargo update --workspace was used instead of the rm+generate-lockfile recipe. "
                    f"Fix: rm Cargo.lock && cargo +1.86 generate-lockfile (with .cargo/config.toml temporarily disabled).")
              sys.exit(1)
          if not lock_src or not lock_src.startswith("registry+https://github.com/rust-lang/crates.io"):
              print(f"::error::Cargo.lock libfreemkv must come from crates.io registry, not local path. "
                    f"Run rm Cargo.lock && cargo generate-lockfile with [patch.crates-io] disabled. "
                    f"(saw source={lock_src!r})")
              sys.exit(1)
          print(f"Cargo.lock libfreemkv = {lock_ver} from {lock_src}")
          PY

  build:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.86.0

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release

      - name: Package
        run: |
          DIR="bdemu-${{ github.ref_name }}"
          mkdir -p "$DIR/profiles"
          cp target/release/bdemu "$DIR/"
          cp target/release/libbdemu.so "$DIR/" 2>/dev/null || true
          cp -r profiles/* "$DIR/profiles/" 2>/dev/null || true
          # Versioned archive
          tar czf "${DIR}-x86_64-linux.tar.gz" "$DIR"
          # Stable-name archive (for /latest/ URLs)
          tar czf "bdemu-x86_64-linux.tar.gz" "$DIR"

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tar.gz'

  update-readme:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Update version in README
        run: |
          VERSION="${{ github.ref_name }}"
          DATE="$(date -u '+%Y-%m-%d')"
          sed -i "s|^\*\*Latest: v[0-9]*\.[0-9]*\.[0-9]*.*(.*)\*\*|**Latest: ${VERSION} (${DATE})**|" README.md
          sed -i "s|^\*\*Latest: v[0-9]*\.[0-9]*\.[0-9]*\*\*|**Latest: ${VERSION} (${DATE})**|" README.md
          sed -i "s|bdemu-v[0-9]*\.[0-9]*\.[0-9]*|bdemu-${VERSION}|g" README.md
          sed -i "s|/download/v[0-9]*\.[0-9]*\.[0-9]*/|/download/${VERSION}/|g" README.md
          sed -i "s|bdemu [0-9]*\.[0-9]*\.[0-9]*|bdemu ${VERSION#v}|g" README.md
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update to bdemu ${{ github.ref_name }}"
          git push

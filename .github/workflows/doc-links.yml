name: doc-links

# Thin caller → the canonical reusable doc-links gate in freemkv/.github.
# bdemu git-tag-pins libfreemkv and freemkv-unlock, so both siblings are
# checked out and a [patch.crates-io] redirects each at its sibling;
# the reusable resolves the toolchain from rust-version and drops target/doc
# first to avoid the cached-doc-tree race.
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doc-links:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: freemkv/.github/.github/workflows/guard-doclinks.yml@v1
    with:
      self: bdemu
      checkout: libfreemkv freemkv-unlock
      patch: libfreemkv freemkv-unlock

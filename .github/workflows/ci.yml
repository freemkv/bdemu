name: CI

on:
  push:
    # dev -> qa -> main. `dev` is where work lands and is meant to be pushed
    # to often: these are the FAST checks, so a mistake surfaces in minutes.
    # `qa` is the release candidate — it runs these too, plus the expensive
    # suite in qa.yml. `main` only ever moves at release time, to a tagged
    # commit that was already green on qa.
    branches: [main, dev, qa]
  pull_request:

# Rapid dev pushes supersede their own in-progress runs instead of stacking.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# WHY THE SIBLING CHECKOUTS — this is NOT a monorepo.
#
# bdemu path-deps ../freemkv-unlock (with the `emulation` feature), and CI
# checked out one repo, so that path pointed at nothing and cargo failed before
# resolving a single dependency. Separately, the committed Cargo.toml resolves
# libfreemkv from a git TAG, so where CI did build it was building against the
# LAST RELEASE of the library rather than its dev tip — a coordinated change
# across the repos could not be verified until release-orchestrate.yml cut the tags.
#
# The fix mirrors the developer's local layout via the shared
# checkout-siblings@v1 composite: every sibling is cloned at the branch-matched
# ref alongside bdemu, reproducing ~/Developer/freemkv/{bdemu,libfreemkv,
# freemkv-unlock} so `../freemkv-unlock` resolves as it does locally, and the
# composite writes a .cargo/config.toml [patch.crates-io] redirecting the
# libfreemkv git-tag patch at the sibling checkout. Config-level [patch]
# wins over the manifest one — the same mechanism local development uses.
#
# `--locked` is gone even though bdemu DOES commit a Cargo.lock. The committed
# lock resolves the freemkv crates as PATH packages and carries [[patch.unused]]
# entries for crates bdemu does not even depend on — artifacts of whichever
# local .cargo/config.toml was active when it was last written. It describes a
# developer's machine, not a release, so gating every push on it would fail for
# reasons that say nothing about the code. release-orchestrate.yml regenerates the lock with
# the real git tags before tagging, and release.yml verifies the pin — that is
# the moment the pin actually has to hold, and it is still gated.
#
# bdemu is a Linux-only product (release.yml builds ubuntu-22.04 only), so
# there is deliberately no macOS/Windows matrix here.

jobs:
  # CI owns the changelog: main may never carry a released version without a
  # CHANGELOG.md entry for it. The release orchestrator dates an existing
  # `## [X.Y.Z]` heading — it does NOT invent one — so a version bump that
  # forgot its changelog entry must fail here rather than ship a blank release.
  # Hard-fails on main (and PRs targeting main); warns elsewhere so an
  # in-progress dev/qa branch whose entry isn't written yet is not blocked.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require a CHANGELOG entry for the crate version on main
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has an entry for ${version}."
            exit 0
          fi
          msg="CHANGELOG.md has no '## [${version}]' entry"
          if [ "${GITHUB_REF_NAME:-}" = "main" ] || [ "${GITHUB_BASE_REF:-}" = "main" ]; then
            echo "::error::${msg} — main requires a changelog entry for the released version."
            exit 1
          fi
          echo "::warning::${msg} (allowed on ${GITHUB_REF_NAME:-unknown}; required before it can reach main)."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: bdemu
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          checkout: libfreemkv freemkv-unlock
          patch: libfreemkv
          self: bdemu
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bdemu
      - run: cargo fmt --check
        working-directory: bdemu
      # --all-targets so the test code is linted too, not just the binary.
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: bdemu

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: bdemu
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          checkout: libfreemkv freemkv-unlock
          patch: libfreemkv
          self: bdemu
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bdemu
      - run: cargo test --tests
        working-directory: bdemu

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: bdemu
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          checkout: libfreemkv freemkv-unlock
          patch: libfreemkv
          self: bdemu
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          manifest-path: bdemu/Cargo.toml

  # What ships is a release build of the `bdemu` binary plus the cdylib
  # (release.yml packages both). `cargo test` only ever builds the dev profile,
  # and release-only link failures are real — the cdylib in particular is not
  # produced by any other job here.
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: bdemu
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          checkout: libfreemkv freemkv-unlock
          patch: libfreemkv
          self: bdemu
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bdemu
      - run: cargo build --release
        working-directory: bdemu

  # Coverage is informational only and NON-REQUIRED: it is not aggregated by any
  # umbrella/`needs:` gate, and Codecov runs in informational mode (see
  # codecov.yml), so it never blocks a merge or release. It mirrors the `test`
  # job's sibling-checkout layout — bdemu is not a monorepo, so the siblings and
  # the generated .cargo/config.toml patch are what let cargo resolve at all.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: bdemu
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          checkout: libfreemkv freemkv-unlock
          patch: libfreemkv
          self: bdemu
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bdemu
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --ignore-run-fail --lcov --output-path lcov.info
        working-directory: bdemu
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bdemu/lcov.info
          slug: freemkv/bdemu
          fail_ci_if_error: false

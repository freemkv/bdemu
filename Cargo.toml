[package]
name = "bdemu"
version = "0.28.0"
edition = "2024"
rust-version = "1.86"
license = "AGPL-3.0-only"
description = "Blu-ray Drive Emulator — LD_PRELOAD SCSI interceptor with JSON profiles"
repository = "https://github.com/freemkv/bdemu"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "bdemu"
path = "src/bin.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
libfreemkv = "0.28"

# ─── DEV-ONLY LOCAL PATCH — DO NOT COMMIT/PUSH AS RELEASE ─────────────────────
# libfreemkv 0.28.0 is not published yet; build against the local copy for the
# 0.28.0 prep. Strip this before release (publish libfreemkv first).
[patch.crates-io]
libfreemkv = { path = "../libfreemkv" }

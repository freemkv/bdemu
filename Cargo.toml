[package]
name = "bdemu"
version = "1.0.0-rc.4.3"
edition = "2024"
rust-version = "1.86"
license = "AGPL-3.0-only"
description = "Blu-ray Drive Emulator — LD_PRELOAD SCSI interceptor with JSON profiles"
repository = "https://github.com/freemkv/bdemu"
readme = "README.md"
keywords = ["bluray", "emulator", "scsi", "testing", "disc"]
categories = ["development-tools::testing", "hardware-support"]
# Keep internal AI-instruction / private notes out of the published crate.
exclude = ["CLAUDE.md"]

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "bdemu"
path = "src/bin.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
libfreemkv = "1.0.0-rc.4.3"
freemkv-unlock-ld = { git = "https://github.com/freemkv/freemkv-unlock", rev = "ef3a6fe42d8a5184061609040b10f0c2d814b52d" }

[profile.release]
lto = "thin"
codegen-units = 1

# Resolve libfreemkv from its GIT TAG instead of crates.io, so the release build
# starts the instant the libfreemkv tag exists — no waiting on the crates.io
# publish + index propagation. This [patch.crates-io] is committed (CI-visible)
# and also redirects the transitive libfreemkv that freemkv-unlock-ld pulls from
# crates.io, unifying both refs to the single git-tag source. The release script
# rewrites this tag to the new version before regenerating Cargo.lock. Local dev
# overrides it with a path patch via the gitignored .cargo/config.toml.
[patch.crates-io]
libfreemkv = { git = "https://github.com/freemkv/libfreemkv", tag = "v1.0.0-rc.4.3" }
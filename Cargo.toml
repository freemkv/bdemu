[package]
name = "bdemu"
version = "0.25.0"
edition = "2024"
rust-version = "1.86"
license = "AGPL-3.0-only"
description = "Blu-ray Drive Emulator — LD_PRELOAD SCSI interceptor with JSON profiles"
repository = "https://github.com/freemkv/bdemu"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "bdemu"
path = "src/bin.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
libfreemkv = "0.25"

# Local development override: build bdemu against the sibling
# libfreemkv repo so iteration loops pick up local changes immediately
# without a crates.io round-trip. Must be removed (along with bumping
# the `libfreemkv = "0.NN"` constraint) before `cargo publish`.
[patch.crates-io]
libfreemkv = { path = "../libfreemkv" }

[package]
name = "bdemu"
version = "1.0.0-rc.3"
edition = "2024"
rust-version = "1.86"
license = "AGPL-3.0-only"
description = "Blu-ray Drive Emulator — LD_PRELOAD SCSI interceptor with JSON profiles"
repository = "https://github.com/freemkv/bdemu"
readme = "README.md"
keywords = ["bluray", "emulator", "scsi", "testing", "disc"]
categories = ["development-tools::testing", "hardware-support"]
# Keep internal AI-instruction / private notes out of the published crate.
exclude = ["CLAUDE.md"]

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "bdemu"
path = "src/bin.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
libfreemkv = "1.0.0-rc.3"
freemkv-unlock-ld = { git = "https://github.com/freemkv/freemkv-unlock", rev = "feacfbb10bf4a197da4b53ab7846efaa181751b6" }

[profile.release]
lto = "thin"
codegen-units = 1